[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isofate"
version = "0.1.2"
requires-python = ">=3.11"

dependencies = [
 "numpy==2.3",
 "scipy==1.16.1",
 "matplotlib==3.10.0",
 "atmodeller==0.9.1",
 "numba>=0.62",
 "optimistix==0.0.10",
 "emcee",
 "corner"
]

[tool.setuptools.packages.find]
where = ["."] 
include = ["isofate*"]

[tool.setuptools.package-data]
isofate = ["data/**/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

